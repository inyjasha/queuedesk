name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: queuedesk
          POSTGRES_PASSWORD: queuedesk
          POSTGRES_DB: queuedesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queuedesk -d queuedesk_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_REDIS_ADDR: localhost:6379
      TEST_DATABASE_URL: postgres://queuedesk:queuedesk@localhost:5432/queuedesk_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/api
